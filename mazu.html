<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聖母酷解｜現代線上媽祖廟</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
      text-align: center;
    }
    .card {
      background: #1e1e1e;
      border-radius: 20px;
      padding: 20px;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      border: 1px solid #333;
    }
    .tab-buttons {
      display: flex;
      margin-bottom: 20px;
      background: #2a2a2a;
      border-radius: 12px;
      padding: 3px;
    }
    .tab-btn {
      flex: 1;
      padding: 8px 0;
      border: none;
      background: transparent;
      color: #aaa;
      font-size: 15px;
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
    }
    .tab-btn.active {
      background: #e63946;
      color: #fff;
    }
    .section { display: none; }
    .section.active { display: block; }
    
    .icon-container {
      font-size: 55px;
      margin: 15px 0;
      min-height: 75px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .shake {
      animation: shake 0.5s infinite;
    }
    @keyframes shake {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(-12deg); }
      75% { transform: rotate(12deg); }
      100% { transform: rotate(0deg); }
    }
    
    .btn {
      background: #e63946;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
      transition: background 0.2s;
    }
    .btn:active { background: #b82a36; }
    
    .result-title {
      font-size: 20px;
      font-weight: bold;
      color: #ffb703;
      margin-top: 10px;
    }
    .result-poem {
      font-size: 15px;
      color: #ffd166;
      font-style: italic;
      margin: 8px 0;
      line-height: 1.5;
    }
    .result-desc {
      font-size: 13px;
      color: #ddd;
      margin-top: 8px;
      line-height: 1.5;
      background: #282828;
      padding: 10px;
      border-radius: 10px;
      text-align: left;
    }
    .result-desc span {
      color: #e63946;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="tab-buttons">
      <button class="tab-btn active" onclick="switchTab('divination')">請示擲筊</button>
      <button class="tab-btn" onclick="switchTab('fortune')">求媽祖籤</button>
    </div>

    <!-- 擲筊區塊 -->
    <div id="divination" class="section active">
      <div id="biao-icon" class="icon-container">🌙 🌙</div>
      <div id="biao-result" class="result-title">向媽祖稟告</div>
      <div id="biao-desc" class="result-desc" style="text-align:center;">心裡默念姓名、生日與問題，點擊下方擲筊請示聖意。</div>
      <button class="btn" onclick="castBiao()">開始擲筊</button>
    </div>

    <!-- 求籤區塊 -->
    <div id="fortune" class="section">
      <div id="stick-icon" class="icon-container">🌊</div>
      <div id="stick-result" class="result-title">媽祖靈籤</div>
      <div id="stick-poem" class="result-poem"></div>
      <div id="stick-desc" class="result-desc" style="text-align:center;">虔誠搖動籤筒，請媽祖指點迷津。</div>
      <button class="btn" onclick="drawStick()">搖筒求籤</button>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      if (tab === 'divination') {
        event.target.classList.add('active');
        document.getElementById('divination').classList.add('active');
      } else {
        event.target.classList.add('active');
        document.getElementById('fortune').classList.add('active');
      }
    }

    // 擲筊邏輯
    function castBiao() {
      const icon = document.getElementById('biao-icon');
      const title = document.getElementById('biao-result');
      const desc = document.getElementById('biao-desc');
      
      icon.classList.add('shake');
      title.innerText = '聖意斟酌中...';
      desc.innerText = '';

      setTimeout(() => {
        icon.classList.remove('shake');
        const rand = Math.random();
        
        if (rand < 0.5) { // 聖筊
          icon.innerText = '🌙 ☁️';
          title.innerText = '【聖筊】';
          title.style.color = '#4caf50';
          desc.innerHTML = '<span>媽祖指示：</span>準了！照你的直覺去做，順勢而為，免驚！';
        } else if (rand < 0.75) { // 笑筊
          icon.innerText = '☁️ ☁️';
          title.innerText = '【笑筊】';
          title.style.color = '#ff9800';
          desc.innerHTML = '<span>媽祖微笑：</span>問得太含糊或你自己早就心知膽明，再想清楚一點重問吧！';
        } else { // 陰筊
          icon.innerText = '🌙 🌙';
          title.innerText = '【陰筊】';
          title.style.color = '#f44336';
          desc.innerHTML = '<span>媽祖搖頭：</span>這事先停一下！時機不對或方向有誤，硬衝會受傷。';
        }
      }, 700);
    }

    // 現代酷版媽祖靈籤庫
    const mazuFortunes = [
      {
        level: '大吉',
        title: '第一籤：順風順水',
        poem: '風平浪靜好行舟，大展鴻圖在目前。',
        desc: '<span>【媽祖開示】</span><br>職場：順風順水，建議主動出擊或提出想法！<br>財運：穩健獲利，但記得落袋為安。<br>感情：緣分已到位，別再龜毛了！'
      },
      {
        level: '上吉',
        title: '第二籤：貴人相助',
        poem: '海中明珠光閃耀，自有人前引路來。',
        desc: '<span>【媽祖開示】</span><br>職場：這陣子會遇到給力的神隊友或貴人主管。<br>投資：聽專家或身邊靠譜朋友的建議，別盲目跟風。<br>健康：少熬夜，貴人可救不了你的肝！'
      },
      {
        level: '中吉',
        title: '第三籤：穩住別慌',
        poem: '風浪雖然稍微大，掌緊船舵自無憂。',
        desc: '<span>【媽祖開示】</span><br>職場：最近可能會被突發狀況洗禮，冷靜處理就能過關。<br>感情：有點小摩擦，少說兩句酸話，多聽對方說。<br>開運：喝杯熱拿鐵，給自己五分鐘靜心。'
      },
      {
        level: '平籤',
        title: '第四籤：躺平養生',
        poem: '舟行淺灘宜等待，潮水漲時自然通。',
        desc: '<span>【媽祖開示】</span><br>生活：最近別硬衝，適合「低功耗運作」。<br>職場：做完份內事就好，不要主動攬事做。<br>錢財：管住你的手，離購物車和交割戶遠一點！'
      },
      {
        level: '酷籤',
        title: '第五籤：醒醒吧你',
        poem: '水中撈月空費力，夢裡尋花鏡中香。',
        desc: '<span>【媽祖開示】</span><br>感情：對方喜不喜歡你你自己心裡沒數嗎？別再腦補了！<br>職場：想離職先看存款，別衝動遞辭呈。<br>提醒：洗洗睡吧，夢裡什麼都有。'
      },
      {
        level: '上吉',
        title: '第六籤：轉角遇到愛',
        poem: '桃花開在春風裡，月老紅線已牽成。',
        desc: '<span>【媽祖開示】</span><br>感情：單身者多出去走走，最近氣場很吸人！<br>職場：人際關係大拉升，適合拓展合作交流。<br>小撇步：穿亮一點的衣服會有奇效。'
      },
      {
        level: '中平',
        title: '第七籤：防範小人',
        poem: '暗潮湧動需留意，講話留心防小人。',
        desc: '<span>【媽祖開示】</span><br>職場：辦公室八卦少聽少講，小心被當槍使。<br>財務：借錢免談，不管是誰借都說「錢被媽祖拿去扣押了」。'
      },
      {
        level: '大吉',
        title: '第八籤：財神敲門',
        poem: '金山銀山鋪滿路，勤勞致富好時機。',
        desc: '<span>【媽祖開示】</span><br>財運：偏財運不錯，買發票或刮刮樂有機會！<br>職涯：加薪或拿到業績獎金的機率高，加油把這波拿下來。'
      },
      {
        level: '特籤',
        title: '第九籤：強制休假',
        poem: '身體才是本錢在，莫為浮名累了身。',
        desc: '<span>【媽祖開示】</span><br>健康警告：肩頸是不是很酸？眼睛是不是很乾？<br>媽祖命令：今天下班不許加班，體貼自己吃頓好的！'
      },
      {
        level: '大吉',
        title: '第十籤：海闊天空',
        poem: '千江有水千江月，萬里無雲萬里天。',
        desc: '<span>【媽祖開示】</span><br>心境：困擾你很久的事情終於要解開了。<br>未來：保持信心，跨過去之後一片光明，媽祖在後面罩你！'
      }
    ];

    // 抽籤邏輯
    function drawStick() {
      const icon = document.getElementById('stick-icon');
      const title = document.getElementById('stick-result');
      const poem = document.getElementById('stick-poem');
      const desc = document.getElementById('stick-desc');
      
      icon.classList.add('shake');
      title.innerText = '媽祖顯靈中...';
      poem.innerText = '';
      desc.innerText = '';

      setTimeout(() => {
        icon.classList.remove('shake');
        const result = mazuFortunes[Math.floor(Math.random() * mazuFortunes.length)];
        
        icon.innerText = '📜';
        title.innerText = `【${result.level}】${result.title}`;
        title.style.color = '#ffb703';
        poem.innerText = result.poem;
        desc.innerHTML = result.desc;
      }, 1000);
    }
  </script>
</body>
</html>
