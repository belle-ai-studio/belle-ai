<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta property="og:title" content="Belle AI｜每日心理測驗">
<meta property="og:description" content="別想太久，第一眼選就好 🐾 看看今天的你最需要知道什麼。">
<meta property="og:image" content="https://belle-ai-studio.github.io/belle-ai/line-cover.png">
<meta property="og:url" content="https://belle-ai-studio.github.io/belle-ai/daily.html">
<meta property="og:type" content="website">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(circle at top left, #fff7f1, transparent 35%),
        radial-gradient(circle at bottom right, #f8e8e3, transparent 35%),
        #fffaf6;
      color: #4a352d;
      min-height: 100vh;
    }

    .container {
      width: min(92%, 760px);
      margin: 0 auto;
      padding: 30px 0 60px;
    }

    .brand {
      text-align: center;
      font-size: 18px;
      letter-spacing: 2px;
      margin-bottom: 20px;
      color: #8c6255;
    }

    .brand span {
      margin: 0 5px;
    }

    .card {
      background: rgba(255,255,255,.88);
      border-radius: 26px;
      padding: 26px;
      box-shadow: 0 12px 40px rgba(111, 75, 59, .10);
      border: 1px solid #f0ded4;
    }

    .date {
      text-align: center;
      color: #b18477;
      font-size: 14px;
      margin-bottom: 8px;
    }

    h1 {
      text-align: center;
      font-size: clamp(26px, 6vw, 38px);
      margin: 8px 0 12px;
      line-height: 1.35;
    }

    .intro {
      text-align: center;
      color: #8b7770;
      line-height: 1.8;
      margin: 0 auto 24px;
      font-size: 15px;
    }

    .quiz-image {
      display: block;
      width: 100%;
      border-radius: 20px;
      border: 1px solid #ead8cf;
      background: #f8eee9;
      margin-top: 12px;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .choice {
      border: 0;
      border-radius: 16px;
      padding: 14px 6px;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      background: #f4e7e2;
      color: #704f45;
      transition: .2s ease;
    }

    .choice:hover {
      transform: translateY(-2px);
      background: #ead7d0;
    }

    .choice.selected {
      background: #a97869;
      color: white;
    }

    .hint {
      text-align: center;
      margin: 15px 0 0;
      color: #a08b83;
      font-size: 13px;
    }

    .result {
      display: none;
      margin-top: 25px;
      padding: 23px;
      border-radius: 20px;
      background: #fff7f3;
      border: 1px solid #ead6ce;
      animation: appear .4s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .result.show {
      display: block;
    }

    .result-label {
      color: #b37f70;
      font-size: 14px;
      margin-bottom: 7px;
    }

    .result h2 {
      margin: 0 0 13px;
      font-size: 23px;
      line-height: 1.5;
    }

    .result-text {
      line-height: 1.9;
      font-size: 16px;
      color: #57443d;
    }

    .reminder {
      margin-top: 18px;
      padding: 15px 17px;
      border-radius: 14px;
      background: #f1e3dd;
      line-height: 1.7;
    }

    .reminder strong {
      color: #9f6e60;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      font-size: 13px;
      line-height: 1.8;
      color: #a28b82;
    }

    .preview {
      text-align: center;
      margin-top: 25px;
      font-size: 12px;
      color: #b29b92;
    }

    @media (max-width: 520px) {
      .container {
        width: 94%;
        padding-top: 16px;
      }

      .card {
        padding: 18px 14px 22px;
      }

      .choices {
        gap: 7px;
      }

      .choice {
        padding: 12px 4px;
        font-size: 18px;
      }

      .result {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="brand">
    🐾 <span>Belle AI 每日心理測驗</span> 🐾
  </div>

  <div class="card">

    <div class="date" id="dateText"></div>

    <h1 id="question"></h1>

    <img

    <div class="choices">

      <button class="choice" onclick="showResult('C', this)">C</button>
      <button class="choice" onclick="showResult('D', this)">D</button>
    </div>

    <p class="hint">

    </p>

    <div class="result" id="resultBox">

      <div class="result-label" id="resultLabel"></div>

      <h2 id="resultTitle"></h2>

      <div class="result-text" id="resultText"></div>

      <div class="reminder">
        <strong>今日提醒｜</strong>
        <span id="resultReminder"></span>

    </div>

  </div>

  <div class="footer">

    直覺有時候，只是在提醒你最近比較在意什麼。
    <br><br>
    🐶🐱 Belle AI
  </div>

</div>

/* =============================
   自動判斷日期
   ============================= */

function getQuizIndex() {

  const params = new URLSearchParams(window.location.search);

  // 測試網址可以使用 daily.html?day=1 ~ day=7
  const previewDay = Number(params.get("day"));

  if (previewDay >= 1 && previewDay <= 7) {
    return previewDay - 1;
  }

  const now = new Date();

  const month = now.getMonth() + 1;
  const day = now.getDate();

  if (month === 9 && day >= 1 && day <= 7) {
    return day - 1;
  }

  // 9/1以前先顯示第一題
  if (month < 9) {
    return 0;
  }

  // 9/7之後先停留在第七題
  return 6;
}


const quizIndex = getQuizIndex();
const currentQuiz = quizzes[quizIndex];


document.getElementById("dateText").textContent = currentQuiz.date;
document.getElementById("question").textContent = currentQuiz.question;
document.getElementById("prompt").textContent = currentQuiz.prompt;
document.getElementById("quizImage").src = currentQuiz.image;


function showResult(choice, button) {

  document.querySelectorAll(".choice").forEach(btn => {
    btn.classList.remove("selected");
  });

  button.classList.add("selected");

  const answer = currentQuiz.answers[choice];

  document.getElementById("resultLabel").textContent =
    "你選擇了 " + choice;

  document.getElementById("resultTitle").textContent =
    answer.title;

  document.getElementById("resultText").textContent =
    answer.text;

  document.getElementById("resultReminder").textContent =
    answer.reminder;

  const resultBox = document.getElementById("resultBox");

  resultBox.classList.add("show");

  setTimeout(() => {
    resultBox.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
  }, 100);
}
