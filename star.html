<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belle AI 命理館 - 宿曜星宿多人群組解碼矩陣 </title>
    <style>
        :root {
            --bg-color: #0d0e15;
            --card-bg: #161824;
            --primary: #8a2be2;
            --primary-glow: rgba(138, 43, 226, 0.4);
            --accent: #00f0ff;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --border: #2d3142;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            width: 100%;
            margin-top: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: #fff;
            text-shadow: 0 0 10px var(--primary-glow);
            margin-bottom: 5px;
            font-size: 2rem;
        }

        header p {
            color: var(--text-muted);
            margin: 0;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        h2 {
            margin-top: 0;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            font-size: 1.4rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: #08090d;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 8px var(--primary-glow);
        }

        .btn {
            background: linear-gradient(135deg, var(--primary), #4b0082);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(138, 43, 226, 0.6);
        }

        .flex-row {
            display: flex;
            gap: 15px;
        }

        .flex-row .form-group {
            flex: 1;
        }

        /* 角色清單樣式 */
        .roster {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .roster-item {
            background: #1e2235;
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }

        .roster-item .remove-btn {
            color: #ff4a4a;
            cursor: pointer;
            font-weight: bold;
            border: none;
            background: none;
        }

        /* 比對面板 */
        .comparison-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        /* 報告解碼樣式 */
        #report-section {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-box {
            background: rgba(138, 43, 226, 0.1);
            border: 1px dashed var(--primary);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .relation-title {
            font-size: 1.8rem;
            color: #fff;
            text-align: center;
            margin: 10px 0;
            font-weight: 800;
        }

        .perspective-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #2d3142;
            border-radius: 10px;
            padding: 15px;
            margin-top: 15px;
        }

        .perspective-tag {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .tag-family { background-color: #3b82f6; color: #fff; }
        .tag-couple { background-color: #ec4899; color: #fff; }
        .tag-friend { background-color: #10b981; color: #fff; }

        .relation-desc {
            line-height: 1.6;
            color: var(--text-main);
            white-space: pre-line;
            font-size: 0.95rem;
        }

        .mansion-tag {
            display: inline-block;
            background: var(--accent);
            color: #000;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .gender-badge {
            font-size: 0.8rem;
            padding: 1px 5px;
            border-radius: 3px;
            margin-left: 5px;
            font-weight: bold;
        }
        .gender-boy { background-color: #00bfff; color: #fff; }
        .gender-girl { background-color: #ff69b4; color: #fff; }

        @media (max-width: 600px) {
            .flex-row, .comparison-grid {
                flex-direction: column;
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Belle AI 命理館</h1>
            <p>🌌 宿曜星宿・多人群組關係解碼矩陣 v2 🌌</p>
        </header>

        <div class="card">
            <h2>👤 第一步：建立你的角色地圖 (NPC名單)</h2>
            <div class="flex-row">
                <div class="form-group">
                    <label for="char-name">姓名/稱呼</label>
                    <input type="text" id="char-name" placeholder="例如：爸爸、媽媽、未來的兒子">
                </div>
                <div class="form-group">
                    <label for="char-birth">出生年月日</label>
                    <input type="date" id="char-birth" value="1995-01-01">
                </div>
                <div class="form-group" style="max-width: 120px;">
                    <label for="char-gender">預設性別</label>
                    <select id="char-gender">
                        <option value="男">男 ♂</option>
                        <option value="女">女 ♀</option>
                    </select>
                </div>
            </div>
            <button class="btn" id="add-char-btn">➕ 登錄到名單中</button>
            
            <div class="roster" id="roster-container">
                </div>
        </div>

        <div class="card" id="compare-card" style="display:none;">
            <h2>⚡
