        }

        }

        }

            margin-bottom: 5px;
            font-size: 2rem;
        }

        header p {

        }

            padding: 12px;
            background-color: #08090d;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {

            border-color: var(--primary);

        }

            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            width: 100%;

            box-shadow: 0 4px 15px var(--primary-glow);
        }

            gap: 15px;

            gap: 10px;
            margin-top: 15px;

            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;

            cursor: pointer;
            font-weight: bold;
            border: none;
            background: none;
        }

        .comparison-grid {

            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        /* 報告解碼樣式 */
        #report-section {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-box {
            background: rgba(138, 43, 226, 0.1);
            border: 1px dashed var(--primary);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;

        .relation-title {
            font-size: 1.8rem;
            color: #fff;
            text-align: center;
            margin: 10px 0;

            font-weight: bold;

        @media (max-width: 600px) {
            .flex-row, .comparison-grid {
                flex-direction: column;
                grid-template-columns: 1fr;

        }
    </style>
</head>

        function getMansion(dateStr) {
            const date = new Date(dateStr);
            const baseDate = new Date("1900-01-01");
            const diffDays = Math.floor((date - baseDate) / (1000 * 60 * 60 * 24));
            const index = Math.abs(diffDays) % 27;
            return mansions[index];
        }

        function getDistance(m1, m2) {
            const idx1 = mansions.indexOf(m1);
            const idx2 = mansions.indexOf(m2);
            let dist = (idx2 - idx1 + 27) % 27;
            if (dist > 13) {
                dist = 27 - dist;
            }
            return dist;
        }

        // --- UI 角色管理系統 ---
        let characters = [];

        const charNameInput = document.getElementById("char-name");
        const charBirthInput = document.getElementById("char-birth");
        const charGenderInput = document.getElementById("char-gender");
        const addCharBtn = document.getElementById("add-char-btn");
        const rosterContainer = document.getElementById("roster-container");
        
        const compareCard = document.getElementById("compare-card");
        const compareA = document.getElementById("compare-a");
        const compareB = document.getElementById("compare-b");
        const decodeBtn = document.getElementById("decode-btn");

        const reportSection = document.getElementById("report-section");
        const mansionInfo = document.getElementById("mansion-info");
        const relationResult = document.getElementById("relation-result");

        const descFamily = document.getElementById("desc-family");
        const descCouple = document.getElementById("desc-couple");
        const descFriend = document.getElementById("desc-friend");
        const relationGameplay = document.getElementById("relation-gameplay");

        // 1. 添加角色到清單
        addCharBtn.addEventListener("click", () => {
            const name = charNameInput.value.trim();
            const birth = charBirthInput.value;
            const gender = charGenderInput.value;

            if (!name) {
                alert("請輸入角色姓名/稱呼！");
                return;
            }

            const mansion = getMansion(birth);
            const newChar = { id: Date.now(), name, birth, mansion, gender };
            characters.push(newChar);

            charNameInput.value = "";
            updateUI();
        });

        window.removeChar = function(id) {
            characters = characters.filter(c => c.id !== id);
            updateUI();
        };

        function updateUI() {
            rosterContainer.innerHTML = "";
            characters.forEach(c => {
                const genClass = c.gender === "男" ? "gender-boy" : "gender-girl";
                const item = document.createElement("div");
                item.className = "roster-item";
                item.innerHTML = `
                    <strong>${c.name}</strong> 
                    <span class="gender-badge ${genClass}">${c.gender}</span>
                    <span class="mansion-tag">${c.mansion}宿</span>
                    <button class="remove-btn" onclick="removeChar(${c.id})">×</button>
                `;
                rosterContainer.appendChild(item);
            });

            if (characters.length >= 2) {
                compareCard.style.display = "block";
                const selectedA = compareA.value;
                const selectedB = compareB.value;

                compareA.innerHTML = "";
                compareB.innerHTML = "";

                characters.forEach(c => {
                    const optA = document.createElement("option");
                    optA.value = c.id;
                    optA.textContent = `${c.name} (${c.gender} - ${c.mansion}宿)`;
                    compareA.appendChild(optA);

                    const optB = document.createElement("option");
                    optB.value = c.id;
                    optB.textContent = `${c.name} (${c.gender} - ${c.mansion}宿)`;
                    compareB.appendChild(optB);
                });

                if (selectedA) compareA.value = selectedA;
                if (selectedB) compareB.value = selectedB;
            } else {
                compareCard.style.display = "none";
            }
        }

        // 2. 啟動解碼
        decodeBtn.addEventListener("click", () => {
            const idA = compareA.value;
            const idB = compareB.value;

            if (idA === idB) {
                alert("解碼需要選擇兩個不同的人，自己不能跟自己干涉喔！");
                return;
            }

            const charA = characters.find(c => c.id == idA);
            const charB = characters.find(c => c.id == idB);

            const dist = getDistance(charA.mansion, charB.mansion);

            // 讀取對應關係解釋
            let result = relationMap[dist];
            
            if (!result) {
                result = { 
                    name: "未知波動", 
                    family: "你們的關係波動極其奇特，落在了宿曜27進制運算的系統灰暗地帶。這代表你們不被任何既定框架和標籤定義！",
                    couple: "在情感的重力場中，你們注定要打破常規，創造屬於你們自己獨一無二的默契與火花！",
                    friend: "超出了本機的演算法範圍，或許你們注定是打破常規、互相激發奇特靈感的神祕組合！"

            // 提取男女星宿特性
            const traitA = genderMansionTraits[charA.mansion] ? genderMansionTraits[charA.mansion][charA.gender] : "暫無此載體代碼解析。";
            const traitB = genderMansionTraits[charB.mansion] ? genderMansionTraits[charB.mansion][charB.gender] : "暫無此載體代碼解析。";

            // 渲染報告 UI
            const genBadgeA = charA.gender === "男" ? `<span class="gender-badge gender-boy">男 ♂</span>` : `<span class="gender-badge gender-girl">女 ♀</span>`;
            const genBadgeB = charB.gender === "男" ? `<span class="gender-badge gender-boy">男 ♂</span>` : `<span class="gender-badge gender-girl">女 ♀</span>`;

            mansionInfo.innerHTML = `
                <div style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; border-left: 3px solid var(--accent);">
                    🔮 <strong>${charA.name}</strong> ${genBadgeA} 載體：<span class="mansion-tag">${charA.mansion}宿</span><br>
                    <p style="margin: 8px 0 0 0; font-size: 0.9rem; color: var(--text-muted); line-height: 1.4;">💡 <strong>性別特質解碼：</strong>${traitA}</p>
                </div>
                <div style="background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; border-left: 3px solid var(--primary);">
                    ⚡ <strong>${charB.name}</strong> ${genBadgeB} 載體：<span class="mansion-tag">${charB.mansion}宿</span><br>
                    <p style="margin: 8px 0 0 0; font-size: 0.9rem; color: var(--text-muted); line-height: 1.4;">💡 <strong>性別特質解碼：</strong>${traitB}</p>
                </div>
            `;

            relationResult.textContent = `【 ${result.name} 】`;
            
            // 寫入三大視角的描述
            descFamily.textContent = result.family;
            descCouple.textContent = result.couple;
            descFriend.textContent = result.friend;

            // 加入主導權、業力流向解析與破局攻略
            let roleFlow = "";
            if (result.name.includes("安壞")) {
                roleFlow = `📌 **【角色業力流向】**：
根據代碼公式，在此干涉場中：
* **${charA.name}** 扮演的是「壞（破壞/挑戰者）」角色。
* **${charB.name}** 扮演的是「安（掌控/築牆者）」角色。
「壞」天生會打破「安」的規則，而「安」則會本能試圖限制「壞」。`;
            } else if (result.name.includes("危成")) {
                roleFlow = `📌 **【角色業力流向】**：
根據代碼公式，在此干涉場中：
* **${charA.name}** 扮演的是「危（危害/受惠方）」角色。
* **${charB.name}** 扮演的是「成（成就/工具人）」角色。
「成」會無怨無悔地付出資源來成就「危」，而「危」則是這場關係中的終極受益者。`;
            } else if (result.name.includes("友衰")) {
                roleFlow = `📌 **【角色業力流向】**：
根據代碼公式，在此干涉場中：
* **${charA.name}** 扮演的是「衰（消耗/被愛方）」角色。
* **${charB.name}** 扮演的是「友（付出/陪伴方）」角色。
「友」會傾盡全力給予「衰」滿滿的陪伴與情感，但「衰」在無形中會像黑洞一樣吸走「友」的時間與專注力。`;
            } else {
                roleFlow = `📌 **【角色業力流向】**：
此關係為對等共振代碼，沒有絕對的掌控方，雙方能量在平行空間中對稱流動，講求頻率同步。`;
            }

            relationGameplay.innerHTML = `
                <p style="line-height: 1.6; color: var(--text-main); white-space: pre-line; margin-bottom: 15px;">${roleFlow}</p>
                <p style="line-height: 1.6; color: var(--text-main); white-space: pre-line;">🎮 **【玩家破局攻略】**：
既然這只是系統分配的初始重力場，你就完全不需要被規則綁死。明白這段關係的 Bug 在哪裡，你就能『隨心所欲』地在生活中調度能量，把他們當成你人生遊戲裡的專屬副本！</p>
            `;

            reportSection.style.display = "block";
            reportSection.scrollIntoView({ behavior: 'smooth' });
        });
    </script>
