<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>姓名色彩研究所｜Belle AI Studio</title>
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#35443c;background:#f5f7f3}*{box-sizing:border-box}body{margin:0}main{max-width:740px;margin:auto;padding:16px 12px 45px}.hero{background:linear-gradient(125deg,#dce9df,#f7f0e6);border-radius:23px;text-align:center;padding:34px 15px;color:#3c5948}.hero h1{font-size:29px;margin:9px 0}.hero p{margin:7px;font-size:13px}.eyebrow{font-size:11px;letter-spacing:.18em}.panel{background:white;border:1px solid #e1e8e2;border-radius:19px;padding:19px;margin-top:16px}.tabs{display:flex;gap:8px;margin-bottom:14px}button{font:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #86ad90;outline-offset:2px}.tab{flex:1;padding:12px;border:0;border-radius:11px;background:#f0f3ef;color:#607064}.tab.active{background:#e0ede1;color:#385b41;font-weight:700}.field{display:block;margin:12px 0;font-size:13px;color:#617165}.field input{display:block;width:100%;margin-top:6px;padding:13px;border-radius:11px;border:1px solid #d7e0d8;font-size:16px;color:#35443c;background:#fafbf9}.hint{font-size:12px;color:#829187}.primary{background:#55735c;color:white;border:0;border-radius:12px;padding:14px;width:100%;font-weight:700;margin-top:8px}.center{text-align:center}.small{font-size:12px;color:#7a8a7e}.heading{font-size:17px;font-weight:700;margin:17px 0 10px}.name{font-size:24px;font-weight:700;margin:8px 0}.palette,.topics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.swatch{border:2px solid transparent;border-radius:12px;padding:7px;text-align:left;background:#f7f9f6;min-width:0}.swatch.active{border-color:#63896b}.patch{height:87px;border-radius:8px}.swatch strong{display:block;font-size:12px;margin-top:8px}.swatch span{font-size:11px;color:#69786e;word-break:break-all}.detail{border-radius:14px;padding:18px;margin-top:15px;line-height:1.9;color:#304638}.detail h3{margin:0 0 5px;font-size:18px}.detail p{margin:7px 0;white-space:pre-line;font-size:14px}.six-item{padding:13px 0;border-bottom:1px solid #e8ece8}.six-item h4{margin:0 0 7px;font-size:15px}.six-item p{font-size:14px;line-height:1.9;margin:0}.summary{background:#f5f7f4;border-radius:13px;padding:16px;font-size:14px;line-height:1.95;white-space:pre-line}.topic{border:1px solid transparent;border-radius:12px;padding:14px 5px;font-size:13px;color:#35483b;min-height:56px}.topic.active{outline:2px solid #668a70;outline-offset:1px;font-weight:700}.quote{font-style:italic;color:#526b58}.topic-section{margin:12px 0}.topic-section strong{font-size:14px}.topic-section p{margin:3px 0;font-size:14px;line-height:1.85}.bars{display:flex;gap:5px;margin:7px 0 14px}.bars span{flex:1;height:45px;border-radius:5px}.pair-reading{line-height:1.9;font-size:14px;white-space:pre-line}.share{border-radius:15px;padding:25px 18px;text-align:center}.share-palette{display:flex;justify-content:center;gap:6px;margin:20px auto}.share-palette span{width:15%;height:65px;border-radius:5px}.share-quote{font-size:15px;line-height:1.8}.save{width:100%;padding:12px;border-radius:12px;border:1px solid #d6e0d7;background:white;margin-top:12px;font-weight:600}.footer{text-align:center;font-size:12px;line-height:1.8;color:#7b8b7f;margin:22px 8px}#pairFields[hidden],#compatibility[hidden]{display:none}@media(max-width:380px){.hero h1{font-size:25px}.panel{padding:14px}.swatch strong{font-size:11px}.topic{font-size:12px}}
</style>
</head>
<body><main>
<header class="hero"><div class="eyebrow">BELLE AI STUDIO</div><h1>姓名色彩研究所</h1><p>名前に宿る六つの色</p><p>在名字裡，遇見六種不同的自己</p></header>
<section class="panel"><div class="tabs"><button class="tab active" id="single" type="button">✦ 單人解析</button><button class="tab" id="double" type="button">♡ 雙人合盤</button></div><label class="field">你的姓名<input id="name1" value="賴宜均" placeholder="請輸入姓名" maxlength="40"></label><div id="pairFields" hidden><label class="field">另一位的姓名<input id="name2" placeholder="輸入對方姓名" maxlength="40"></label><div class="hint">不限中英文</div></div><button class="primary" id="generate" type="button">生成我的姓名六色 ✦</button></section>
<section class="panel"><div class="center"><div class="small">THE SIX COLORS OF YOUR NAME</div><div class="name" id="displayName"></div><div class="small">屬於你的六色圖鑑 · 點選色塊閱讀解析</div></div><div class="palette" id="palette" style="margin-top:18px"></div><div class="detail" id="colorDetail"><div class="small">你正在閱讀的色彩</div><h3 id="colorTitle"></h3><p id="colorText"></p></div><h2 class="heading">✦ 六色完整圖鑑</h2><div id="allSix"></div><h2 class="heading">姓名色彩總結</h2><div class="summary" id="summary"></div></section>
<section class="panel"><div class="center"><h2 class="heading">✦ 六大進階主題探索</h2><div class="small">六個主題，對應六種不同的姓名色彩</div></div><div class="topics" id="topics" style="margin-top:18px"></div><div class="detail" id="topicDetail"><h3 id="topicTitle"></h3><div class="small" id="topicColor"></div><p class="quote" id="topicQuote"></p><div id="topicText"></div></div></section>
<section class="panel" id="compatibility" hidden><h2 class="heading center">♡ 雙人色彩合盤</h2><div id="pairPalettes"></div><div class="pair-reading" id="pairReading"></div></section>
<section class="panel"><h2 class="heading center">✦ 我的色彩分享卡</h2><div class="tabs"><button class="tab active" id="light">☀ 日系白色</button><button class="tab" id="dark">☾ 夜色黑色</button></div><div class="share" id="share"><div class="eyebrow">BELLE AI · NAME COLORS</div><div class="name" id="shareName"></div><div class="share-palette" id="shareColors"></div><p class="share-quote" id="shareQuote"></p><div class="small">姓名色彩研究所</div></div><button class="save" id="save">儲存分享卡 PNG</button></section>
<p class="footer">姓名色彩為象徵性創作，供娛樂與自我探索，並非科學人格測驗或命運預測。<br>© BELLE AI STUDIO</p>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const names=['奶霧米杏','鼠尾草綠','柔光香檳金','暮光薰衣草','暖陶玫瑰','靜海灰藍','薄荷晨光','雲莓粉','月桂青','海鹽藍','杏桃日光','暮山紫','橄欖綠','琥珀砂','櫻霧粉','冰河青','月光銀','暖栗棕'];
const hex=['#E8DCCB','#A9BFA5','#D5BD79','#B7A3C9','#C78368','#697F91','#B5D9C7','#D7A8B8','#729C8C','#91B7C7','#E8B58E','#A59BC1','#A0AB76','#CEAE7D','#E6C1C9','#75ADB0','#C9D2D5','#AD806A'];
const traits=['溫柔與包容','安定與平衡','價值與累積','直覺與想像','熱情與真誠','理性與界線','清新與希望','細膩與體貼','沉穩與思考','溝通與理解','行動與溫暖','想像與探索','耐心與韌性','踏實與耕耘','關懷與連結','自由與彈性','秩序與清晰','承諾與責任'];
const positions=[['外在氣質','這道色彩象徵你與世界相遇時的第一印象。'],['內在核心','這道色彩象徵你內心最重視的價值。'],['天賦之光','這道色彩象徵你願意長期培養的能力。'],['隱藏心境','這道色彩象徵你不一定會直接表達的感受。'],['情感溫度','這道色彩象徵你與重要之人的連結方式。'],['成長課題','這道色彩象徵你正在學習的生活功課。']];
const topics=[
{icon:'♡',title:'愛情與關係',pos:4,quote:'好的關係，讓兩個人都能安心做自己。',sections:[['情感表達','你可以探索自己更習慣用行動、言語還是陪伴來表達在乎。'],['親密需求','舒服的關係需要被理解，也需要適當的個人空間。'],['相處提醒','當期待沒有被滿足時，試著說清楚需求，而不是期待對方猜測。']]},
{icon:'◇',title:'財富與金錢觀',pos:1,quote:'財富不只是數字，也是選擇生活的自由。',sections:[['金錢安全感','可以思考你更看重穩定的儲蓄、收入成長，還是能自由安排的時間。'],['價值取向','把金錢用在真正重視的事情上，比盲目追求外在標準更有意義。'],['累積方向','以預備金、長期儲蓄及可持續的技能累積，逐步建立選擇權。']]},
{icon:'✧',title:'事業與天賦',pos:2,quote:'讓努力留下作品，讓能力逐漸發光。',sections:[['優勢象徵','你可以觀察自己在規劃、創作、協調或執行方面，哪種工作最有成就感。'],['工作方式','適合自己的節奏，往往比一味增加工作量更容易持續。'],['發展課題','嘗試把反覆完成的工作整理成流程、工具或可以分享的成果。']]},
{icon:'☾',title:'內在自我',pos:3,quote:'理解自己，是一種安靜而深刻的勇氣。',sections:[['內在需求','有些情緒不需要立刻處理，可以先允許自己感受到它們。'],['自我界線','不是每個人的期待都需要由你負責。'],['照顧方式','找一段不被打擾的時間，重新確認自己真正想要的是什麼。']]},
{icon:'♧',title:'人際與貴人',pos:0,quote:'值得同行的人，會尊重彼此的步伐。',sections:[['合作偏好','可以留意自己偏好清楚分工、自由討論，還是穩定而有默契的合作。'],['相處界線','願意幫忙是優點，但適當拒絕也能保護關係。'],['辨識支持','真正可靠的夥伴，會透過行動、尊重和承諾建立信任。']]},
{icon:'✦',title:'人生與成長',pos:5,quote:'人生不必急著抵達，也可以慢慢成為自己。',sections:[['核心價值','思考哪些事情即使沒有外界掌聲，你仍然願意長期投入。'],['人生方向','可以把遠大的願望拆成眼前能實踐的小步驟。'],['成長提醒','成熟有時不是承擔更多，而是知道哪些事情可以放下。']]}
];
let dual=false,selected=1,topic=0,dark=false,main=[],partner=[],a='',b=';
function hash(s){let h=2166136261;for(const c of s)h=Math.imul(h^c.codePointAt(0),16777619);return h>>>0}
function palette(s){if(s==='王小明')return [0,1,2,3,4,5];const h=hash(s),out=[];for(let i=0;i<6;i++){let n=((h>>>((i%4)*6))+i*11+h%17)%18;while(out.includes(n))n=(n+1)%18;out.push(n)}return out}
function bg(i){return hex[i]+'33'}
function focus(){const i=main[selected],el=$('colorDetail');el.style.background=bg(i);el.style.border='1px solid '+hex[i];$('colorTitle').textContent=positions[selected][0]+'｜'+names[i]+' '+hex[i];$('colorText').textContent=positions[selected][1]+'\n\n'+names[i]+'代表「'+traits[i]+'」的色彩意象。你可以從這個角度，觀察自己在生活中的需求與選擇。';document.querySelectorAll('.swatch').forEach((el,j)=>el.classList.toggle('active',j===selected))}
function renderPalette(){const box=$('palette'),all=$('allSix');box.replaceChildren();all.replaceChildren();main.forEach((i,j)=>{const btn=document.createElement('button');btn.className='swatch';const patch=document.createElement('div');patch.className='patch';patch.style.background=hex[i];const title=document.createElement('strong');title.textContent=names[i];const code=document.createElement('span');code.textContent=hex[i];btn.append(patch,title,code);btn.addEventListener('click',()=>{selected=j;focus()});box.append(btn);const row=document.createElement('div');row.className='six-item';const h=document.createElement('h4');h.textContent=String(j+1).padStart(2,'0')+'｜'+positions[j][0]+' · '+names[i];const p=document.createElement('p');p.textContent=positions[j][1]+'這個顏色象徵「'+traits[i]+'」。';row.append(h,p);all.append(row)});focus()}
function renderTopic(){const t=topics[topic],i=main[t.pos],box=$('topicDetail');box.style.background=bg(i);box.style.border='1px solid '+hex[i];$('topicTitle').textContent=t.icon+' '+t.title;$('topicColor').textContent='對應色｜'+names[i]+' '+hex[i];$('topicQuote').textContent='「'+t.quote+'」';$('topicText').replaceChildren();t.sections.forEach(([heading,body])=>{const sec=document.createElement('div');sec.className='topic-section';const h=document.createElement('strong');h.textContent=heading;const p=document.createElement('p');p.textContent=body;sec.append(h,p);$('topicText').append(sec)});document.querySelectorAll('.topic').forEach((el,j)=>{const color=main[topics[j].pos];el.style.background=bg(color);el.style.borderColor=hex[color];el.classList.toggle('active',j===topic)})}
function renderPair(){if(!dual)return;const box=$('pairPalettes');box.replaceChildren();[[a,main],[b,partner]].forEach(([n,p])=>{const section=document.createElement('div'),h=document.createElement('strong'),bar=document.createElement('div');h.textContent=n;bar.className='bars';p.forEach(i=>{const item=document.createElement('span');item.style.background=hex[i];bar.append(item)});section.append(h,bar);box.append(section)});const shared=main.filter(i=>partner.includes(i));$('pairReading').textContent='【共同色彩】\n'+(shared.length?'你們共有 '+shared.length+' 種相同色彩：'+shared.map(i=>names[i]).join('、')+'。':'你們的六色各不相同，呈現兩種獨立的色彩組合。')+'\n\n【內在核心】\n'+a+'的核心色是'+names[main[1]]+'，象徵'+traits[main[1]]+'；'+b+'的核心色是'+names[partner[1]]+'，象徵'+traits[partner[1]]+'。\n\n【相處建議】\n色彩可以成為討論彼此需求的趣味起點，但不代表真實的關係契合度。'}
function renderShare(){const card=$('share');card.style.background=dark?'#202b2a':'#f8f6f0';card.style.color=dark?'#f5f1e9':'#394d3f';$('shareName').textContent=a+(dual?' × '+b:'');$('shareColors').replaceChildren();main.forEach(i=>{const el=document.createElement('span');el.style.background=hex[i];$('shareColors').append(el)});$('shareQuote').textContent='「'+topics[topic].quote+'」';$('light').classList.toggle('active',!dark);$('dark').classList.toggle('active',dark)}
function render(){a=$('name1').value.trim()||'未命名';b=$('name2').value.trim()||'另一位旅人';main=palette(a);partner=palette(b);selected=1;$('displayName').textContent=a;$('summary').textContent='你的六色從「'+names[main[0]]+'」開始，以「'+names[main[1]]+'」作為內在核心，最後由「'+names[main[5]]+'」象徵成長課題。\n\n這組色彩包含'+traits[main[1]]+'、'+traits[main[2]]+'與'+traits[main[5]]+'等不同面向。你可以從中選擇最有共鳴的部分，作為探索自己的起點。';renderPalette();renderTopic();renderShare();$('compatibility').hidden=!dual;renderPair()}
topics.forEach((t,i)=>{const btn=document.createElement('button');btn.className='topic';btn.textContent=t.icon+' '+t.title;btn.addEventListener('click',()=>{topic=i;renderTopic();renderShare()});$('topics').append(btn)});
$('single').addEventListener('click',()=>{dual=false;$('pairFields').hidden=true;$('single').classList.add('active');$('double').classList.remove('active');render()});$('double').addEventListener('click',()=>{dual=true;$('pairFields').hidden=false;$('double').classList.add('active');$('single').classList.remove('active');render()});$('generate').addEventListener('click',render);$('light').addEventListener('click',()=>{dark=false;renderShare()});$('dark').addEventListener('click',()=>{dark=true;renderShare()});
$('save').addEventListener('click',()=>{const c=document.createElement('canvas');c.width=900;c.height=1100;const x=c.getContext('2d');x.fillStyle=dark?'#202b2a':'#f8f6f0';x.fillRect(0,0,900,1100);x.textAlign='center';x.fillStyle=dark?'#f5f1e9':'#394d3f';x.font='25px sans-serif';x.fillText('BELLE AI · NAME COLORS',450,150);x.font='bold 46px sans-serif';const label=(a+(dual?' × '+b:''));x.fillText(label.length>17?label.slice(0,17)+'…':label,450,265);main.forEach((i,j)=>{const cx=100+j*118;x.fillStyle=hex[i];x.fillRect(cx,360,108,230);x.fillStyle=dark?'#f5f1e9':'#394d3f';x.font='17px sans-serif';x.fillText(names[i],cx+54,620);x.font='15px monospace';x.fillText(hex[i],cx+54,650)});x.fillStyle=dark?'#f5f1e9':'#394d3f';x.font='24px sans-serif';x.fillText(topics[topic].quote,450,780);x.font='21px sans-serif';x.fillText('姓名色彩研究所',450,965);const link=document.createElement('a');link.download='Belle-Name-Colors.png';link.href=c.toDataURL('image/png');link.click()});
render();
})();
</script></body></html>
